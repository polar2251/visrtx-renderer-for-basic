name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $env:ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys*') {
              throw 'Inno Setup signature validation failed.'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'inno'
          $install = Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',('/DIR="' + $directory + '"') -WindowStyle Hidden -PassThru -Wait
          if ($install.ExitCode) { throw "Inno Setup installer exited with $($install.ExitCode)." }
          "ISCC=$directory\ISCC.exe" >> $env:GITHUB_ENV
      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.1.0' }
          .\packaging\build.ps1 -Version $version -InnoCompiler $env:ISCC
      - uses: actions/upload-artifact@v6
        with:
          name: VisrtxRendererForBasic-Windows-x64
          path: |
            dist/VisrtxRendererForBasic-Setup-x64.exe
            dist/VisrtxRendererForBasic-Setup-x64.exe.sha256
          if-no-files-found: error
      - name: Attach installer to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @('dist/VisrtxRendererForBasic-Setup-x64.exe', 'dist/VisrtxRendererForBasic-Setup-x64.exe.sha256')
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag @assets --clobber
          } else {
              gh release create $tag @assets --verify-tag --title "Visrtx Renderer for basic $tag" --generate-notes
          }
          exit $LASTEXITCODE
